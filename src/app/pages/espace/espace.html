<div class="espace">
  <aside class="menu">
    <a class="menu__logo" routerLink="/" aria-label="La Maison des Contes, retour au site">
      <img src="assets/badge-maison-des-contes.webp" alt="La Maison des Contes" width="277" height="352">
    </a>

    <nav class="menu__liens" aria-label="Espace parent">
      <a routerLink="/compte" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
        Accueil
      </a>
      <a routerLink="/compte/contes" routerLinkActive="actif">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13C17 4 14 4.500 12 6zM12 6v13"/></svg>
        Mes contes
      </a>
      <a routerLink="/compte/abonnement" routerLinkActive="actif">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.600 5.500 6 .8-4.400 4.200 1.100 6L12 16.600 6.700 19.500l1.100-6L3.400 9.300l6-.8z"/></svg>
        Abonnement
      </a>
      <a routerLink="/compte/collection" routerLinkActive="actif">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="11" height="15" rx="2" transform="rotate(-8 8 13)"/><rect x="10" y="3" width="11" height="15" rx="2" transform="rotate(6 15 10)"/></svg>
        Collection
      </a>
    </nav>

    <div class="menu__bas">
      <a class="bouton-or" [href]="appUrl">Ouvrir l’application</a>
      <button type="button" class="bouton-lien" (click)="deconnecter()" [disabled]="enCours()">Se déconnecter</button>
    </div>
  </aside>

  <main class="contenu">
    <header class="salut">
      @if (auth.avatar(); as avatar) {
        <img class="salut__avatar" [src]="avatar" alt="" width="52" height="52" referrerpolicy="no-referrer">
      }
      <div>
        <p class="salut__titre">Bonjour {{ auth.nom() }} !</p>
        <p class="salut__mail">{{ auth.utilisateur()?.email }}</p>
      </div>
    </header>

    @if (donnees.erreur()) {
      <p class="message-erreur" role="alert">
        {{ donnees.erreur() }}
        <button type="button" class="bouton-lien" (click)="donnees.charger()">Réessayer</button>
      </p>
    }

    <router-outlet />
  </main>
</div>
